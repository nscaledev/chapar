[project]
name = "chapar"
version = "1.0.0"
description = "Chapar operator CLI: catalog, target scopes, images, validation, CVE"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6,<7"]

[project.scripts]
chapar = "chapar.cli:main"

[dependency-groups]
# jsonschema mirrors the system python3-jsonschema the validation shell
# suites use to check result manifests; the venv python shadows it in tests.
dev = ["pytest>=9.0.3,<10", "ruff>=0.12,<1", "basedpyright>=1,<2", "jsonschema>=4,<5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chapar"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

        spack_build_stage: /tmp/chapar-example/example-lab/linux-x86_64-v4/work/spack-stage
        image_staging: /tmp/chapar-example/example-lab/linux-x86_64-v4/work/image-stage
        validation_work: /tmp/chapar-example/example-lab/linux-x86_64-v4/work/validation
        resolver_work: /tmp/chapar-example/example-lab/linux-x86_64-v4/work/resolver

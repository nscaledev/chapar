template_version: 1.0.0
datacenter_id: example-lab
status: example
description: Disposable contract fixture for offline validation only
# install_tree is deliberately NOT under /tmp/chapar-example like the other
# roots. Every target here selects a container, and container injection copies
# store prefixes into the image at their identical absolute path, so the store
# root must live in the reserved /opt/chapar namespace -- see
# tools/chapar_config/paths.py CONTAINER_PREFIX. /tmp would be actively wrong:
# Enroot mounts a tmpfs over /tmp (conf/mounts/10-system.fstab), so an injected
# tree there would be shadowed at run time. The README's disposable rewrite of
# /tmp/chapar-example therefore leaves these store roots untouched; no offline
# step creates or writes them.
targets:
  - target: linux-aarch64-gb300
    allowed_software_sets:
      - vlad
      - all
    container_selections:
      - software_set: vlad
        container: nvidia-vlad
    paths:
      durable_writable:
        install_tree: /opt/chapar/example-lab/linux-aarch64-gb300/install
        releases: /tmp/chapar-example/example-lab/linux-aarch64-gb300/releases
        modulefiles: /tmp/chapar-example/example-lab/linux-aarch64-gb300/modules
        writable_buildcache: /tmp/chapar-example/example-lab/linux-aarch64-gb300/buildcache
        ccache: /tmp/chapar-example/example-lab/linux-aarch64-gb300/ccache
        container_outputs: /tmp/chapar-example/example-lab/linux-aarch64-gb300/containers
        receipts: /tmp/chapar-example/example-lab/linux-aarch64-gb300/receipts
        evidence: /tmp/chapar-example/example-lab/linux-aarch64-gb300/evidence
      read_only_inputs:
        - kind: software_catalog
          path: /tmp/chapar-example/authorities/software-catalog
        - kind: target_registry
          path: /tmp/chapar-example/authorities/targets.json
        - kind: container_registry
          path: /tmp/chapar-example/authorities/containers.json
        - kind: sources_lock
          path: /tmp/chapar-example/authorities/sources-lock.json
        - kind: seed_mirror
          path: /tmp/chapar-example/seed/linux-aarch64-gb300
      temporary:
        release_staging: /tmp/chapar-example/example-lab/linux-aarch64-gb300/releases/.staging
        spack_build_stage: /tmp/chapar-example/example-lab/linux-aarch64-gb300/work/spack-stage
        image_staging: /tmp/chapar-example/example-lab/linux-aarch64-gb300/work/image-stage
        validation_work: /tmp/chapar-example/example-lab/linux-aarch64-gb300/work/validation
        resolver_work: /tmp/chapar-example/example-lab/linux-aarch64-gb300/work/resolver
    slurm:
      partition: example-arm-build
      constraint: example-gb300
      account: example-chapar
      qos: example-offline
    roles:
      builder: example-arm-builder
      validator: example-arm-validator
      publisher: example-arm-publisher
    sharing:
      shared_path_classes: []
      share_across_targets: false
      share_across_software_sets: false
      seed_mirrors_read_only: true
    publication:
      publish_buildcache: false
      publish_modules: false
      publish_containers: false
      promote_current: false
  - target: linux-aarch64-generic
    allowed_software_sets:
      - vlad
      - all
    container_selections:
      - software_set: vlad
        container: nvidia-vlad
    paths:
      durable_writable:
        install_tree: /opt/chapar/example-lab/linux-aarch64-generic/install
        releases: /tmp/chapar-example/example-lab/linux-aarch64-generic/releases
        modulefiles: /tmp/chapar-example/example-lab/linux-aarch64-generic/modules
        writable_buildcache: /tmp/chapar-example/example-lab/linux-aarch64-generic/buildcache
        ccache: /tmp/chapar-example/example-lab/linux-aarch64-generic/ccache
        container_outputs: /tmp/chapar-example/example-lab/linux-aarch64-generic/containers
        receipts: /tmp/chapar-example/example-lab/linux-aarch64-generic/receipts
        evidence: /tmp/chapar-example/example-lab/linux-aarch64-generic/evidence
      read_only_inputs:
        - kind: software_catalog
          path: /tmp/chapar-example/authorities/software-catalog
        - kind: target_registry
          path: /tmp/chapar-example/authorities/targets.json
        - kind: container_registry
          path: /tmp/chapar-example/authorities/containers.json
        - kind: sources_lock
          path: /tmp/chapar-example/authorities/sources-lock.json
        - kind: seed_mirror
          path: /tmp/chapar-example/seed/linux-aarch64-generic
      temporary:
        release_staging: /tmp/chapar-example/example-lab/linux-aarch64-generic/releases/.staging
        spack_build_stage: /tmp/chapar-example/example-lab/linux-aarch64-generic/work/spack-stage
        image_staging: /tmp/chapar-example/example-lab/linux-aarch64-generic/work/image-stage
        validation_work: /tmp/chapar-example/example-lab/linux-aarch64-generic/work/validation
        resolver_work: /tmp/chapar-example/example-lab/linux-aarch64-generic/work/resolver
    slurm:
      partition: example-arm-build
      constraint: example-aarch64-generic
      account: example-chapar
      qos: example-offline
    roles:
      builder: example-arm-builder
      validator: example-arm-validator
      publisher: example-arm-publisher
    sharing:
      shared_path_classes: []
      share_across_targets: false
      share_across_software_sets: false
      seed_mirrors_read_only: true
    publication:
      publish_buildcache: false
      publish_modules: false
      publish_containers: false
      promote_current: false
  - target: linux-x86_64-generic
    allowed_software_sets:
      - hpcsim
      - vlad
      - all
    # Two selections for one target: the generic x86 target now carries both the
    # HPCSim container and the Vlad container, which is what registering
    # linux-x86_64-generic in nvidia-vlad.allowed_targets makes expressible.
    container_selections:
      - software_set: hpcsim
        container: ubuntu-hpcsim
      - software_set: vlad
        container: nvidia-vlad
    paths:
      durable_writable:
        install_tree: /opt/chapar/example-lab/linux-x86_64-generic/install
        releases: /tmp/chapar-example/example-lab/linux-x86_64-generic/releases
        modulefiles: /tmp/chapar-example/example-lab/linux-x86_64-generic/modules
        writable_buildcache: /tmp/chapar-example/example-lab/linux-x86_64-generic/buildcache
        ccache: /tmp/chapar-example/example-lab/linux-x86_64-generic/ccache
        container_outputs: /tmp/chapar-example/example-lab/linux-x86_64-generic/containers
        receipts: /tmp/chapar-example/example-lab/linux-x86_64-generic/receipts
        evidence: /tmp/chapar-example/example-lab/linux-x86_64-generic/evidence
      read_only_inputs:
        - kind: software_catalog
          path: /tmp/chapar-example/authorities/software-catalog
        - kind: target_registry
          path: /tmp/chapar-example/authorities/targets.json
        - kind: container_registry
          path: /tmp/chapar-example/authorities/containers.json
        - kind: sources_lock
          path: /tmp/chapar-example/authorities/sources-lock.json
        - kind: seed_mirror
          path: /tmp/chapar-example/seed/linux-x86_64-generic
      temporary:
        release_staging: /tmp/chapar-example/example-lab/linux-x86_64-generic/releases/.staging
        spack_build_stage: /tmp/chapar-example/example-lab/linux-x86_64-generic/work/spack-stage
        image_staging: /tmp/chapar-example/example-lab/linux-x86_64-generic/work/image-stage
        validation_work: /tmp/chapar-example/example-lab/linux-x86_64-generic/work/validation
        resolver_work: /tmp/chapar-example/example-lab/linux-x86_64-generic/work/resolver
    slurm:
      partition: example-x86-build
      constraint: example-x86-generic
      account: example-chapar
      qos: example-offline
    roles:
      builder: example-x86-builder
      validator: example-x86-validator
      publisher: example-x86-publisher
    sharing:
      shared_path_classes: []
      share_across_targets: false
      share_across_software_sets: false
      seed_mirrors_read_only: true
    publication:
      publish_buildcache: false
      publish_modules: false
      publish_containers: false
      promote_current: false

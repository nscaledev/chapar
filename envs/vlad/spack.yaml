# vlad is a minimal HPC/AI cluster validation environment.
# It builds a focused set of benchmarks, profilers, GPU transport,
# and MPI framework validation tools without visualization,
# postprocessing, in-situ, or simulation application roots.
#
# Site paths, shared cache roots, ccache roots, and publication
# choices are intentionally not stored here; copy
# envs/vlad/vlad-site.env.example to envs/vlad/vlad-site.env instead.
spack:
  repos: []

  definitions:
  - toolchain_specs:
    # vlad overrides AGENTS.md major-only rule per owner instruction;
    # uses HPC-recommended profiled bootstrap (same as hpcsim's gcc@15+profiled %gcc).
    # +profiled works on Linux x86_64; the aarch64 conflict is macOS-specific.
    # bootstrap via OS gcc %gcc
    - gcc@15+profiled %gcc
    - cuda@13
  - mpi_specs:
    - openmpi@5+cuda+fortran~internal-pmix fabrics=verbs,ucx schedulers=slurm cuda_arch=75,80,86,87,89,90,90a,100,110,120,121 ^pmix@6 ^ucx@1.20.1+cuda+gdrcopy+dc+rc+rdmacm+thread_multiple+ud+verbs~xpmem cuda_arch=75,80,86,87,89,90,90a,100,110,120,121 ^cuda@13
    - libfabric@2+cuda+gdrcopy fabrics=mlx,rxm,verbs ^cuda@13
    - pmix@6
    - ucx@1.20.1+cuda+gdrcopy+dc+rc+rdmacm+thread_multiple+ud+verbs~xpmem cuda_arch=75,80,86,87,89,90,90a,100,110,120,121 ^cuda@13
  - python_specs:
    - python@3.12:3.12+optimizations+tkinter
  - gpu_specs:
    - cuda-memtest
    - nccl@2.29.7-1 cuda_arch=75,80,86,87,89,90,90a,100,110,120,121
    - nvbandwidth+cuda cuda_arch=75,80,86,87,89,90,90a,100,110,120,121
    - nvtop+cuda support=nvidia cuda_arch=75,80,86,87,89,90,90a,100,110,120,121
  - benchmark_specs:
    - babelstream+cuda cuda_arch=75,80,86,87,89,90,90a,100,110,120,121
    - fio
    - h5bench+exerciser+metadata
    - hpcg+openmp
    - hpl+openmp
    - ior+hdf5+ncmpi
    - mdtest
    - nccl-tests+mpi+cuda cuda_arch=75,80,86,87,89,90,90a,100,110,120,121 ^nccl@2.29.7-1 cuda_arch=75,80,86,87,89,90,90a,100,110,120,121
    - osu-micro-benchmarks@7.5.2
    - qperf+verbs
    - stream+openmp
  - profiling_specs:
    - caliper+mpi+papi+cuda+libunwind+libdw cuda_arch=75,80,86,87,89,90,90a,100,110,120,121
    - darshan-runtime+mpi+hdf5+parallel-netcdf
    - extrae+papi~cuda
    - hpctoolkit@2026.0.1+cuda+mpi+python+papi+viewer~docs~opencl~level_zero~rocm~auditor_default build_system=meson ^python@3.12:3.12+tkinter
    - hwloc+cuda+pci~nvml cuda_arch=75,80,86,87,89,90,90a,100,110,120,121
    - ipm+papi
    - likwid
    - mpip
    - papi+infiniband+cuda
    - py-py-spy
    - scalasca
    - scorep+mpi+papi~cuda
    - tau+mpi+papi+openmp~cuda
  - framework_specs:
    - py-mpi4py
    # py-torch disabled: pip install hangs at build_wheel with CUDA 13 + GCC 15
    # - py-torch+cuda+mpi+nccl cuda_arch=75,80,86,87,89,90,90a,100,110,120,121
  - devtools_specs:
    - autoconf
    - ccache
    - cmake
    - meson
    - ninja
    - numactl

  specs:
  - $toolchain_specs
  - $mpi_specs
  - $python_specs
  - $gpu_specs
  - $benchmark_specs
  - $profiling_specs
  - $framework_specs
  - $devtools_specs

  packages:
    all:
      providers:
        mpi: [openmpi]
        blas: [openblas]
        lapack: [openblas]
        libllvm: [llvm]
        scalapack: [netlib-scalapack]
      require:
      - spec: "target=x86_64_v4"
        when: "target=x86_64"
      - spec: "target=aarch64"
        when: "target=aarch64"
    c:
      require:
      - spec: gcc@15
        when: os=ubuntu24.04
    ccache:
      buildable: true
      externals: []
    cmake:
      require:
      - ~qtgui
    cxx:
      require:
      - spec: gcc@15
        when: os=ubuntu24.04
    dyninst:
      require:
      - spec: 'cxxflags="-include cstdint"'
        when: 'platform=linux %gcc@15:'
    elfutils:
      require:
      - ~debuginfod~nls
    extrae:
      require:
      - spec: 'cflags="-std=gnu17 -Wno-error=implicit-int -Wno-error=implicit-function-declaration -Wno-error=int-conversion -Wno-error=incompatible-pointer-types"'
        when: 'platform=linux %gcc@15:'
    fontconfig:
      require:
      - spec: '@2.15:'
        when: platform=linux
    fortran:
      require:
      - spec: gcc@15
        when: os=ubuntu24.04
    gcc:
      require:
      - spec: +profiled
        when: '@15 platform=linux'
    gdrcopy:
      require:
      - +cuda
      - cuda_arch=75,80,86,87,89,90,90a,100,110,120,121
    glib:
      require:
      - spec: +introspection
        when: platform=linux
    hdf5:
      require:
      - +mpi+fortran+hl+threadsafe
      - spec: '%gcc@15'
        when: platform=linux
    hpctoolkit:
      require:
      - spec: ~opencl~level_zero
        when: platform=linux
    hwloc:
      require:
      - spec: +cuda
        when: platform=linux
      - spec: ~nvml
      - spec: ~opencl
        when: platform=linux
    ior:
      require:
      - spec: 'cflags="-std=gnu17"'
        when: 'platform=linux %gcc@15:'
    libffi:
      require:
      - one_of: ['@3.2.1', '@3.4.7:']
    libfabric:
      require:
      - spec: '@2'
        when: platform=linux
      - spec: +cuda+gdrcopy fabrics=mlx,rxm,verbs
        when: platform=linux
      - spec: cuda_arch=75,80,86,87,89,90,90a,100,110,120,121
        when: '+cuda platform=linux'
    libpressio:
      require:
      - spec: cxxflags="-include algorithm"
        when: '%gcc@15:'
    libsndfile:
      require:
      - spec: 'cflags="-std=gnu17"'
        when: 'platform=linux %gcc@15:'
    libtool:
      require:
      - '@2.4.7:'
    llvm:
      require:
      - '@21'
      - +clang+lld~lldb~flang~polly~ipo build_system=cmake targets=x86,nvptx
    mpip:
      require:
      - spec: '+setjmp~libunwind cflags="-Wno-error=implicit-int -Wno-error=implicit-function-declaration"'
        when: 'platform=linux'
    nccl:
      require:
      - cuda_arch=75,80,86,87,89,90,90a,100,110,120,121
    nccl-tests:
      require:
      - cuda_arch=75,80,86,87,89,90,90a,100,110,120,121
    netcdf-c:
      require:
      - +mpi+parallel-netcdf
      - spec: '%gcc@15'
        when: platform=linux
    netcdf-fortran:
      require:
      - spec: '%gcc@15'
        when: platform=linux
    nvtop:
      require:
      - cuda_arch=75,80,86,87,89,90,90a,100,110,120,121
    openblas:
      require:
      - threads=openmp
    openmpi:
      require:
      - '@5:'
      - spec: +cuda+fortran~internal-hwloc~internal-pmix fabrics=verbs,ucx schedulers=slurm ^pmix@6
        when: platform=linux
      - spec: cuda_arch=75,80,86,87,89,90,90a,100,110,120,121
        when: '+cuda platform=linux'
    parallel-netcdf:
      require:
      - spec: '%gcc@15'
        when: platform=linux
    pmix:
      require:
      - '@6'
    python:
      require:
      - one_of: ['python@3.10:3.10', 'python@3.11:3.11', 'python@3.12:3.12']
    rdma-core:
      require:
      - ~pyverbs
    scalasca:
      require:
      - ^openmpi
    scorep:
      require:
      - spec: '@9.4:'
        when: platform=linux
      - spec: '^binutils libs=shared'
        when: '+binutils platform=linux'
      - spec: 'cflags="-Wno-error=implicit-int -Wno-error=implicit-function-declaration"'
        when: 'platform=linux %gcc@15:'
      # ~cuda avoids Spack's scorep recipe bug: --with-libcuda-lib given
      # without --with-libcuda-include. Score-P 10.0 configure now requires
      # both when one is specified. This is tracked as a Spack recipe issue.
      - spec: '~cuda'
        when: 'platform=linux'
    sz:
      require:
      - +fortran+hdf5+netcdf+openmp
    tau:
      require:
      - spec: '%gcc@15'
        when: platform=linux
      - spec: cxxflags="-include omp.h"
        when: '+openmp %gcc@15:'
    ucx:
      require:
      - spec: +cuda+gdrcopy
        when: platform=linux
      - spec: +dc+rc+rdmacm+thread_multiple+ud+verbs~xpmem
        when: platform=linux
      - spec: cuda_arch=75,80,86,87,89,90,90a,100,110,120,121
        when: '+cuda platform=linux'
    zlib-api:
      require:
      - zlib-ng+compat

  modules:
    default:
      enable:
      - tcl
      tcl:
        naming_scheme: '{name}/{version}'
        hash_length: 0
        exclude_implicits: true
        pulseaudio:
          environment:
            prepend_path:
              LD_LIBRARY_PATH: '{prefix}/lib'

  config:
    deprecated: true
    install_missing: true

  view: false
  concretizer:
    unify: when_possible
    # Environment scope only. etc/system/base/concretizer.yaml keeps
    # granularity: generic for every other environment; overriding it here
    # lets vlad concretize to x86_64_v4 without re-concretizing hpcsim.
    # host_compatible stays true so a non-AVX-512 builder cannot emit v4.
    targets:
      granularity: microarchitecture
      host_compatible: true
    duplicates:
      max_dupes:
        libffi: 2
        py-cython: 3
        py-flit-core: 3
        py-pip: 3
        py-setuptools: 3
        py-wheel: 3
        python: 3
        python-venv: 3

spack:
  repos: []

  # Software roots, grouped by set membership. Selection is driven by two
  # explicit environment variables exported from the site settings
  # (etc/chapar-defaults.sh):
  #
  #   CHAPAR_SOFTWARE_SET  vlad | hpcsim | all   (unset means all: the union)
  #   CHAPAR_TARGET        a key of containers/images/targets.json; only its
  #                        linux-x86_64-* / linux-aarch64-* family matters here
  #
  # A definition whose `when:` is false becomes an empty list, so the $-
  # references under specs: are no-ops for deselected groups. Spack target,
  # LLVM target, and CUDA architecture requirements are deliberately absent
  # from these root specs: they are injected per target as packages:
  # requirements by `chapar target scope` so transitive instances (for example
  # gdrcopy under ucx) are bound too.
  definitions:
  - shared_roots:
    - autoconf
    - cmake
    - cuda-memtest
    - cuda@13
    - darshan-runtime+mpi+hdf5+parallel-netcdf
    - fio
    - gcc@15+profiled %gcc
    - h5bench+exerciser+metadata
    - hpcg+openmp
    - hpctoolkit@2026.0.1+cuda+mpi+python+papi+viewer~docs~opencl~level_zero~rocm~auditor_default build_system=meson ^python@3.12:3.12+tkinter
    - hpl+openmp
    - ior+hdf5+ncmpi
    - libfabric@2+cuda+gdrcopy fabrics=mlx,rxm,verbs ^cuda@13
    - likwid
    - mdtest
    - meson
    - ninja
    - numactl
    - osu-micro-benchmarks@7.5.2
    - papi+infiniband+cuda
    - pmix@6
    - python@3.12:3.12+optimizations+tkinter
    - qperf+verbs
    - scalasca
    - scorep+mpi+papi~cuda
    - stream+openmp
    - tau+mpi+papi+openmp~cuda
    - babelstream+cuda
    - caliper+mpi+papi+cuda+libunwind+libdw
    - ccache
    - hwloc+cuda+pci~nvml
    - nccl-tests+mpi+cuda ^nccl@2.29.7-1
    - nccl@2.29.7-1
    - nvbandwidth+cuda
    - nvtop+cuda support=nvidia
    - openmpi@5+cuda+fortran~internal-pmix fabrics=verbs,ucx schedulers=slurm ^pmix@6 ^ucx@1.20.1+cuda+gdrcopy+dc+rc+rdmacm+thread_multiple+ud+verbs~xpmem ^cuda@13
    - ucx@1.20.1+cuda+gdrcopy+dc+rc+rdmacm+thread_multiple+ud+verbs~xpmem ^cuda@13
  - vlad_roots:
    - extrae+papi~cuda
    - ipm+papi
    - mpip
    - py-mpi4py
    - py-py-spy
    when: env.get("CHAPAR_SOFTWARE_SET", "all") in ("vlad", "all")
  - hpcsim_roots:
    - adios2+mpi+fortran+hdf5~libcatalyst~python %gcc ^openmpi@5
    - cdo+netcdf+hdf5+openmp grib2=eccodes %gcc
    - cgns+mpi+hdf5+fortran %gcc ^openmpi@5
    - eccodes+tools+netcdf+png %gcc
    - exodusii+mpi+fortran %gcc ^openmpi@5
    - ffmpeg %gcc
    - fftw+mpi+openmp precision=double,float %gcc
    - gdb+python ^python@3.12:3.12+tkinter
    - hdf5+mpi+fortran+hl
    - hdf5-vol-async %gcc ^openmpi@5
    - imagemagick@7.1.1-39 ^python@3.12:3.12+optimizations+tkinter
    - libffi@3.2.1
    - 'libffi@3.4.7:'
    - libpressio+mpi+openmp+hdf5+zfp+netcdf~python %gcc ^openmpi@5
    - nccmp %gcc
    - nco+openmp %gcc
    - ncview %gcc
    - neovim
    - netcdf-c+mpi+parallel-netcdf
    - netcdf-fortran
    - netlib-scalapack
    - npm@11.2.0
    - nvshmem+cuda+mpi+ucx+libfabric+nccl ^nccl@2.29.7-1
    - openblas threads=openmp %gcc
    - parallel-netcdf
    - pkgconf
    - pulseaudio@13.0 %gcc ^fftw~mpi
    - python@3.10:3.10+optimizations+tkinter
    - python@3.11:3.11+optimizations+tkinter
    - seacas@2025-10-14+mpi+adios2~fortran~libcatalyst+cgns+applications~legacy~x11 %gcc@15 ^openmpi@5
    - silo+mpi+hdf5+fortran~python %gcc ^openmpi@5
    - sz+openmp+hdf5+netcdf+fortran %gcc
    - tcl
    - tk
    - tmux
    - valgrind+mpi
    - zfp+openmp+fortran %gcc
    when: env.get("CHAPAR_SOFTWARE_SET", "all") in ("hpcsim", "all")
  # Intel MPI ships x86_64 binaries only. Membership follows the declared
  # target, never the machine the solve runs on.
  - hpcsim_x86_only_roots:
    - intel-mpi-benchmarks@2021.7
    - intel-oneapi-mpi@2021.17.0+generic-names+external-libfabric ^libfabric@2+cuda+gdrcopy fabrics=mlx,rxm,verbs ^cuda@13
    when: env.get("CHAPAR_SOFTWARE_SET", "all") in ("hpcsim", "all") and env.get("CHAPAR_TARGET", "").startswith("linux-x86_64-")

  specs:
  - $shared_roots
  - $vlad_roots
  - $hpcsim_roots
  - $hpcsim_x86_only_roots

  packages:
    all:
      providers:
        mpi: [openmpi]
        blas: [openblas]
        lapack: [openblas]
        libllvm: [llvm]
        scalapack: [netlib-scalapack]
    adios2:
      require:
      - ~mgard
      - spec: ldflags="-Wl,--allow-shlib-undefined"
        when: platform=linux
    # One Spack-built GCC 15 provides the language virtuals for the whole
    # environment on every OS. These were conditioned on os=ubuntu24.04, which
    # silently dropped the policy -- not just portability -- on any other OS.
    c:
      require:
      - gcc@15
    cmake:
      require:
      - ~qtgui
    cxx:
      require:
      - gcc@15
    darshan-runtime:
      require:
      - spec: '%gcc@15'
        when: platform=linux
      - spec: 'cflags="-std=gnu17"'
        when: 'platform=linux %gcc@15:'
    dyninst:
      require:
      - spec: 'cxxflags="-include cstdint"'
        when: 'platform=linux %gcc@15:'
    elfutils:
      require:
      - ~debuginfod~nls
    extrae:
      require:
      - spec: 'cflags="-std=gnu17 -Wno-error=implicit-int -Wno-error=implicit-function-declaration -Wno-error=int-conversion -Wno-error=incompatible-pointer-types"'
        when: 'platform=linux %gcc@15:'
    fontconfig:
      require:
      - spec: '@2.15:'
        when: platform=linux
    fortran:
      require:
      - gcc@15
    gcc:
      require:
      - spec: +profiled
        when: '@15 platform=linux'
    gdrcopy:
      require:
      - +cuda
    glib:
      require:
      - spec: +introspection
        when: platform=linux
    hdf5:
      require:
      - +mpi+fortran+hl+threadsafe
      - spec: '%gcc@15'
        when: platform=linux
    hpctoolkit:
      require:
      - spec: ~opencl~level_zero
        when: platform=linux
    hwloc:
      require:
      - spec: +cuda
        when: platform=linux
      - spec: ~nvml
      - spec: ~opencl
        when: platform=linux
    intel-mpi-benchmarks:
      require:
      - spec: '%gcc@15'
        when: platform=linux
    ior:
      require:
      - spec: 'cflags="-std=gnu17"'
        when: 'platform=linux %gcc@15:'
    libfabric:
      require:
      - spec: '@2'
        when: platform=linux
      - spec: +cuda+gdrcopy fabrics=mlx,rxm,verbs
        when: platform=linux
      # shm is libfabric's intra-node provider and carries the CUDA IPC path
      # that reaches peer GPUs over NVLink. The explicit fabrics list above
      # replaces libfabric's sockets,tcp,udp default, so without shm there is no
      # node-local provider at all and same-node ranks fall back to the verbs
      # loopback. tcp is deliberately still absent: a silent TCP fallback would
      # hide exactly the RDMA misconfiguration this stack needs to surface.
      - spec: fabrics=shm
        when: platform=linux
    libffi:
      require:
      - one_of: ['@3.2.1', '@3.4.7:']
    libpressio:
      require:
      - spec: cxxflags="-include algorithm"
        when: '%gcc@15:'
    libsndfile:
      require:
      - spec: 'cflags="-std=gnu17"'
        when: 'platform=linux %gcc@15:'
    libtool:
      require:
      - '@2.4.7:'
    llvm:
      require:
      - '@21'
      - +clang+lld~lldb~flang~polly~ipo build_system=cmake
    mpip:
      require:
      - spec: '+setjmp~libunwind cflags="-Wno-error=implicit-int -Wno-error=implicit-function-declaration"'
        when: platform=linux
    ncview:
      require:
      - spec: 'cflags="-std=gnu17 -Wno-incompatible-pointer-types"'
        when: 'platform=linux %gcc@15:'
    netcdf-c:
      require:
      - +mpi+parallel-netcdf
      - spec: '%gcc@15'
        when: platform=linux
    netcdf-fortran:
      require:
      - spec: '%gcc@15'
        when: platform=linux
    node-js:
      require:
      - '@24.2.0'
      - '~debug~doc~icu4c+openssl+zlib'
    npm:
      require:
      - '@11.2.0'
    openblas:
      require:
      - threads=openmp
    openmpi:
      require:
      - '@5:'
      - spec: +cuda+fortran~internal-hwloc~internal-pmix fabrics=verbs,ucx schedulers=slurm ^pmix@6
        when: platform=linux
      # Open MPI 5 reaches the fabric through the UCX PML, so the accelerated
      # path is inherited from the ucx requirements above. cma adds single-copy
      # intra-node transfers for the shared-memory BTL, which is the path taken
      # when the PML is not UCX.
      - spec: fabrics=cma
        when: platform=linux
    parallel-netcdf:
      require:
      - spec: '%gcc@15'
        when: platform=linux
    pmix:
      require:
      - '@6'
    python:
      require:
      - one_of: ['python@3.10:3.10', 'python@3.11:3.11', 'python@3.12:3.12']
    rdma-core:
      require:
      - ~pyverbs
    scalasca:
      require:
      - ^openmpi
    seacas:
      require:
      - spec: ldflags="-Wl,--allow-shlib-undefined"
        when: '+adios2 platform=linux'
    scorep:
      require:
      - +fortran
      - ~gcc-plugin
      - spec: '@9.4:'
        when: platform=linux
      - spec: '^binutils libs=shared'
        when: '+binutils platform=linux'
      - spec: 'cflags="-Wno-error=implicit-int -Wno-error=implicit-function-declaration"'
        when: 'platform=linux %gcc@15:'
      - spec: '~cuda'
        when: platform=linux
    sz:
      require:
      - +fortran+hdf5+netcdf+openmp
    tau:
      require:
      - spec: '%gcc@15'
        when: platform=linux
      - spec: cxxflags="-include omp.h"
        when: '+openmp %gcc@15:'
    ucx:
      require:
      - spec: +cuda+gdrcopy
        when: platform=linux
      - spec: +dc+rc+rdmacm+thread_multiple+ud+verbs~xpmem
        when: platform=linux
      # mlx5 Direct Verbs is what provides the accelerated rc_mlx5, dc_mlx5 and
      # ud_mlx5 transports used by both InfiniBand and RoCEv2 on ConnectX. Spack
      # defaults mlx5_dv to false and passes --without-mlx5, which leaves only
      # the generic rc_verbs/ud_verbs path and makes +dc inert, because Dynamic
      # Connection exists only in dc_mlx5.
      - spec: +mlx5_dv
        when: platform=linux
      # ib_hw_tm offloads MPI tag matching to the HCA; dm uses mlx5 device
      # memory for small-message latency. Both need mlx5_dv.
      - spec: +dm+ib_hw_tm
        when: platform=linux
      # Cross Memory Attach gives single-copy intra-node transfers. Without it,
      # and with xpmem/knem off because they need site kernel modules, UCX falls
      # back to two-copy shared memory between ranks on the same node.
      - spec: +cma
        when: platform=linux
    zlib-api:
      require:
      - zlib-ng+compat

  modules:
    default:
      enable:
      - tcl
      tcl:
        naming_scheme: '{name}/{version}'
        hash_length: 0
        exclude_implicits: true
        pulseaudio:
          environment:
            prepend_path:
              LD_LIBRARY_PATH: '{prefix}/lib'

  config:
    deprecated: true
    install_missing: true

  view: false
  concretizer:
    unify: when_possible
    duplicates:
      max_dupes:
        libffi: 2
        py-cython: 3
        py-flit-core: 3
        py-pip: 3
        py-setuptools: 3
        py-wheel: 3
        python: 3
        python-venv: 3

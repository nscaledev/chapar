config:
  # config:environments_root is deliberately absent. It read
  # $HPCSIM_HOME_ROOT/environments; no live path in this repository sets that
  # variable -- it survives only in the retired envs/hpcsim site example -- so
  # the key expanded to the literal /environments. Chapar never creates a named
  # managed environment -- release.sh and the resolver address the environment
  # by directory (`spack -e <dir>`) -- so Spack's own default is correct and a
  # selection-derived value would have nothing to derive from: the system scope
  # is read before any selection is verified.
  build_jobs: 16
  concurrent_packages: 16
  ccache: true
  locks: true
  checksum: true
  deprecated: false
  dirty: false
  build_language: C
  verify_ssl: true
  ssl_certs: $SSL_CERT_FILE
  suppress_gpg_warnings: false
  url_fetch_method: urllib
  connect_timeout: 10
  db_lock_timeout: 60
  package_lock_timeout: null
  allow_sgid: true
  install_status: true
  binary_index_ttl: 600
  flags:
    keep_werror: 'none'
  aliases:
    concretise: concretize
    containerise: containerize
    rm: remove
  shared_linking:
    type: rpath
    bind: false

config:
  # config:environments_root is deliberately absent. Chapar never creates a
  # named managed environment -- release.sh addresses the environment by
  # directory (`spack -e <dir>`) -- so Spack's own default is correct and a
  # site-derived value would have nothing to derive from.
  build_jobs: 16
  concurrent_packages: 16
  ccache: true
  locks: true
  checksum: true
  deprecated: false
  dirty: false
  build_language: C
  verify_ssl: true
  ssl_certs: $SSL_CERT_FILE
  suppress_gpg_warnings: false
  url_fetch_method: urllib
  connect_timeout: 10
  db_lock_timeout: 60
  package_lock_timeout: null
  allow_sgid: true
  install_status: true
  binary_index_ttl: 600
  flags:
    keep_werror: 'none'
  aliases:
    concretise: concretize
    containerise: containerize
    rm: remove
  shared_linking:
    type: rpath
    bind: false

# Source mirror only.
#
# Upstream Spack ships exactly one entry in etc/spack/defaults/mirrors.yaml
# (`spack-public`, binary: false). Declaring the equivalent here makes the source
# fetch path an auditable repository fact instead of whatever the vendored Spack
# checkout's defaults scope happens to carry.
#
# Binary mirrors are deliberately absent. Buildcache identity is per build:
# envs/software/release.sh make_scope emits the ordered read-only
# `chapar-seed-NNN` seeds from CHAPAR_SEED_MIRRORS followed by exactly one
# writable `chapar-buildcache`. A binary mirror committed to a persistent scope
# would grant ambient cache authority to every invocation.
mirrors:
  chapar-source:
    binary: false
    url: https://mirror.spack.io
